<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Orbit — 360° Viewer</title>
<style>
  :root{
    --ink:#eef1f4;
    --ink-dim:#9aa3ad;
    --panel:rgba(16,19,24,.72);
    --panel-edge:rgba(255,255,255,.08);
    --accent:#ffc857;
    --danger:#ff6b6b;
    --radius:14px;
    --font-ui:"Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
    --font-data:"SF Mono","Cascadia Mono",ui-monospace,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#0a0c0f;color:var(--ink);font-family:var(--font-ui)}
  #stage{position:fixed;inset:0;cursor:grab}
  #stage.dragging{cursor:grabbing}

  /* ---------- top control bar ---------- */
  .bar{
    position:fixed;top:16px;left:50%;transform:translateX(-50%);
    width:min(680px,calc(100% - 24px));
    display:flex;gap:8px;align-items:center;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--panel-edge);border-radius:var(--radius);
    padding:8px;z-index:10;transition:opacity .35s ease, transform .35s ease;
  }
  .bar.hidden{opacity:0;transform:translateX(-50%) translateY(-8px);pointer-events:none}
  .brand{
    display:flex;align-items:center;gap:7px;padding:0 6px 0 8px;
    font-weight:600;letter-spacing:.04em;font-size:14px;white-space:nowrap;user-select:none;
  }
  .brand svg{flex:none}
  #urlInput{
    flex:1;min-width:0;background:rgba(255,255,255,.06);
    border:1px solid transparent;border-radius:9px;
    color:var(--ink);font:13px/1 var(--font-data);
    padding:10px 12px;outline:none;transition:border-color .15s;
  }
  #urlInput::placeholder{color:var(--ink-dim);font-family:var(--font-ui)}
  #urlInput:focus{border-color:var(--accent)}
  button{
    border:0;border-radius:9px;padding:10px 14px;font:600 13px var(--font-ui);
    cursor:pointer;color:#10131a;background:var(--ink);transition:transform .1s, background .15s;
    white-space:nowrap;
  }
  button:hover{background:#fff}
  button:active{transform:scale(.96)}
  button.ghost{background:rgba(255,255,255,.08);color:var(--ink)}
  button.ghost:hover{background:rgba(255,255,255,.16)}
  button:focus-visible,#urlInput:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- compass strip (signature) ---------- */
  #compass{
    position:fixed;bottom:22px;left:50%;transform:translateX(-50%);
    width:min(420px,70%);height:34px;z-index:10;
    background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
    border:1px solid var(--panel-edge);border-radius:999px;
    overflow:hidden;user-select:none;
    transition:opacity .35s ease;
  }
  #compass.hidden{opacity:0;pointer-events:none}
  #compassTrack{position:absolute;top:0;left:0;height:100%;will-change:transform}
  .tick{position:absolute;top:0;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:3px}
  .tick i{display:block;width:1px;background:rgba(255,255,255,.35);height:8px;margin-bottom:2px}
  .tick.major i{height:12px;background:rgba(255,255,255,.6)}
  .tick span{font:600 10px var(--font-data);color:var(--ink-dim);letter-spacing:.05em}
  .tick.cardinal span{color:var(--ink)}
  #needle{
    position:absolute;left:50%;top:0;width:2px;height:100%;
    background:var(--accent);transform:translateX(-50%);
    box-shadow:0 0 8px rgba(255,200,87,.6);
  }
  #fovBadge{
    position:fixed;bottom:64px;left:50%;transform:translateX(-50%);z-index:10;
    font:600 11px var(--font-data);color:var(--ink-dim);letter-spacing:.08em;
    opacity:0;transition:opacity .25s;pointer-events:none;
  }
  #fovBadge.show{opacity:1}

  /* ---------- status / empty / error ---------- */
  .center{
    position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;
    align-items:center;justify-content:center;z-index:5;pointer-events:none;text-align:center;padding:24px;
  }
  .center.gone{display:none}
  .center h1{font-size:clamp(22px,4vw,34px);font-weight:600;letter-spacing:-.01em}
  .center p{color:var(--ink-dim);font-size:14px;max-width:46ch;line-height:1.55}
  .center .sample{pointer-events:auto}
  .spinner{
    width:34px;height:34px;border-radius:50%;
    border:3px solid rgba(255,255,255,.12);border-top-color:var(--accent);
    animation:spin .8s linear infinite;
  }
  @keyframes spin{to{transform:rotate(360deg)}}
  #errorBox{color:var(--danger);font-size:13px;max-width:52ch;line-height:1.5}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;top:78px;left:50%;transform:translateX(-50%) translateY(-6px);
    background:var(--panel);border:1px solid var(--panel-edge);backdrop-filter:blur(14px);
    border-radius:9px;padding:9px 16px;font-size:13px;z-index:20;
    opacity:0;transition:opacity .25s, transform .25s;pointer-events:none;
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast b{color:var(--accent);font-weight:600}

  @media (max-width:560px){
    .brand span{display:none}
    button{padding:10px 11px}
  }
  @media (prefers-reduced-motion: reduce){
    *{transition:none !important;animation-duration:.01s !important}
  }
</style>
</head>
<body>

<div id="stage"></div>

<!-- top bar -->
<div class="bar" id="bar">
  <div class="brand" title="Orbit 360 viewer">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#ffc857" stroke-width="1.8">
      <circle cx="12" cy="12" r="9"/><ellipse cx="12" cy="12" rx="9" ry="3.6"/>
    </svg>
    <span>Orbit</span>
  </div>
  <input id="urlInput" type="url" spellcheck="false"
         placeholder="Paste a 360° (equirectangular) image URL…">
  <button id="loadBtn">Load</button>
  <button id="shareBtn" class="ghost" title="Copy a link that opens this image">Share</button>
</div>

<!-- empty state -->
<div class="center" id="emptyState">
  <h1>Step inside a photo</h1>
  <p>Paste the URL of any spherical (equirectangular) image above, then drag to look around and scroll to zoom. The Share button gives you a link that opens straight into the same view.</p>
  <button class="sample ghost" id="sampleBtn">Try a sample panorama</button>
</div>

<!-- loading state -->
<div class="center gone" id="loadingState">
  <div class="spinner"></div>
  <p id="loadingText">Loading panorama…</p>
</div>

<!-- error state -->
<div class="center gone" id="errorState">
  <h1>Couldn't load that image</h1>
  <p id="errorBox"></p>
  <button class="sample ghost" id="retryBtn">Try again</button>
</div>

<!-- compass -->
<div id="compass" class="hidden" aria-hidden="true">
  <div id="compassTrack"></div>
  <div id="needle"></div>
</div>
<div id="fovBadge">FOV 75°</div>

<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
  "use strict";

  /* ---------------- DOM ---------------- */
  const stage   = document.getElementById('stage');
  const bar     = document.getElementById('bar');
  const input   = document.getElementById('urlInput');
  const loadBtn = document.getElementById('loadBtn');
  const shareBtn= document.getElementById('shareBtn');
  const sampleBtn=document.getElementById('sampleBtn');
  const retryBtn= document.getElementById('retryBtn');
  const empty   = document.getElementById('emptyState');
  const loading = document.getElementById('loadingState');
  const errorEl = document.getElementById('errorState');
  const errorBox= document.getElementById('errorBox');
  const toast   = document.getElementById('toast');
  const compass = document.getElementById('compass');
  const track   = document.getElementById('compassTrack');
  const fovBadge= document.getElementById('fovBadge');

  const SAMPLE_URL = 'https://threejs.org/examples/textures/2294472375_24a3b8ef46_o.jpg';

  /* ---------------- three.js scene ---------------- */
  const scene  = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1100);
  const renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  stage.appendChild(renderer.domElement);

  const geometry = new THREE.SphereGeometry(500, 64, 44);
  geometry.scale(-1, 1, 1); // view from inside
  const material = new THREE.MeshBasicMaterial({color:0x0a0c0f});
  const sphere = new THREE.Mesh(geometry, material);
  scene.add(sphere);

  /* ---------------- navigation state ---------------- */
  let lon = 0, lat = 0;            // current view angles (deg)
  let targetLon = 0, targetLat = 0;
  let targetFov = 75;
  let hasImage = false;

  let pointerDown = false;
  let downX = 0, downY = 0, downLon = 0, downLat = 0;
  let pinchDist = 0;

  function clampLat(v){ return Math.max(-85, Math.min(85, v)); }
  function clampFov(v){ return Math.max(30, Math.min(100, v)); }

  /* drag — mouse + touch via pointer events */
  stage.addEventListener('pointerdown', e=>{
    if(!hasImage) return;
    pointerDown = true;
    stage.classList.add('dragging');
    stage.setPointerCapture(e.pointerId);
    downX = e.clientX; downY = e.clientY;
    downLon = targetLon; downLat = targetLat;
  });
  stage.addEventListener('pointermove', e=>{
    if(!pointerDown) return;
    const scale = camera.fov / 600; // slower drag when zoomed in
    targetLon = downLon - (e.clientX - downX) * scale * 1.6;
    targetLat = clampLat(downLat + (e.clientY - downY) * scale * 1.6);
  });
  function endDrag(){ pointerDown = false; stage.classList.remove('dragging'); }
  stage.addEventListener('pointerup', endDrag);
  stage.addEventListener('pointercancel', endDrag);

  /* wheel zoom */
  stage.addEventListener('wheel', e=>{
    if(!hasImage) return;
    e.preventDefault();
    targetFov = clampFov(targetFov + e.deltaY * 0.04);
    flashFov();
  }, {passive:false});

  /* pinch zoom */
  stage.addEventListener('touchmove', e=>{
    if(e.touches.length === 2 && hasImage){
      e.preventDefault();
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const d  = Math.hypot(dx, dy);
      if(pinchDist) { targetFov = clampFov(targetFov + (pinchDist - d) * 0.12); flashFov(); }
      pinchDist = d;
    }
  }, {passive:false});
  stage.addEventListener('touchend', ()=>{ pinchDist = 0; });

  /* keyboard navigation */
  addEventListener('keydown', e=>{
    if(!hasImage || e.target === input) return;
    const step = camera.fov / 12;
    if(e.key === 'ArrowLeft')  targetLon -= step;
    if(e.key === 'ArrowRight') targetLon += step;
    if(e.key === 'ArrowUp')    targetLat = clampLat(targetLat + step);
    if(e.key === 'ArrowDown')  targetLat = clampLat(targetLat - step);
    if(e.key === '+' || e.key === '='){ targetFov = clampFov(targetFov - 5); flashFov(); }
    if(e.key === '-'){ targetFov = clampFov(targetFov + 5); flashFov(); }
  });

  addEventListener('resize', ()=>{
    camera.aspect = innerWidth/innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  /* ---------------- compass strip ---------------- */
  const PX_PER_DEG = 2.4;
  (function buildCompass(){
    const cardinals = {0:'N',90:'E',180:'S',270:'W'};
    // build 3 copies (-360..720) so the strip can scroll seamlessly
    for(let d = -360; d < 720; d += 15){
      const norm = ((d % 360) + 360) % 360;
      const t = document.createElement('div');
      t.className = 'tick' + (norm % 90 === 0 ? ' major cardinal' : norm % 45 === 0 ? ' major' : '');
      t.style.left = (d * PX_PER_DEG) + 'px';
      const bar = document.createElement('i');
      t.appendChild(bar);
      if(norm % 45 === 0){
        const s = document.createElement('span');
        s.textContent = cardinals[norm] || norm + '°';
        t.appendChild(s);
      }
      track.appendChild(t);
    }
  })();
  function updateCompass(){
    const heading = ((lon % 360) + 360) % 360;
    const center = compass.clientWidth / 2;
    track.style.transform = `translateX(${center - heading * PX_PER_DEG}px)`;
  }

  let fovTimer;
  function flashFov(){
    fovBadge.textContent = 'FOV ' + Math.round(targetFov) + '°';
    fovBadge.classList.add('show');
    clearTimeout(fovTimer);
    fovTimer = setTimeout(()=>fovBadge.classList.remove('show'), 900);
  }

  /* ---------------- render loop ---------------- */
  function animate(){
    requestAnimationFrame(animate);
    // smooth easing toward targets
    lon += (targetLon - lon) * 0.12;
    lat += (targetLat - lat) * 0.12;
    camera.fov += (targetFov - camera.fov) * 0.12;
    camera.updateProjectionMatrix();

    const phi   = THREE.MathUtils.degToRad(90 - lat);
    const theta = THREE.MathUtils.degToRad(lon);
    camera.lookAt(
      500 * Math.sin(phi) * Math.cos(theta),
      500 * Math.cos(phi),
      500 * Math.sin(phi) * Math.sin(theta)
    );
    if(hasImage) updateCompass();
    renderer.render(scene, camera);
  }
  animate();

  /* ---------------- states ---------------- */
  function show(el){ [empty, loading, errorEl].forEach(x=>x.classList.add('gone')); if(el) el.classList.remove('gone'); }

  /* ---------------- image loading ---------------- */
  let currentURL = null;

  function loadPanorama(url){
    url = (url || '').trim();
    if(!url) return;
    let parsed;
    try { parsed = new URL(url); } catch { showError('That doesn\u2019t look like a valid URL. It should start with https://'); return; }
    if(!/^https?:$/.test(parsed.protocol)){ showError('Only http(s) image URLs are supported.'); return; }

    input.value = url;
    show(loading);
    compass.classList.add('hidden');

    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');
    loader.load(url,
      tex => {
        tex.minFilter = THREE.LinearFilter;
        if(material.map) material.map.dispose();
        material.map = tex;
        material.color.set(0xffffff);
        material.needsUpdate = true;
        hasImage = true;
        currentURL = url;
        targetLon = lon = 0; targetLat = lat = 0; targetFov = 75;
        show(null);
        compass.classList.remove('hidden');
        // reflect in address bar so refresh keeps the image
        const q = new URLSearchParams(location.search);
        q.set('img', url);
        history.replaceState(null, '', location.pathname + '?' + q.toString());
      },
      undefined,
      () => showError(
        'The image could not be fetched. Common causes: the URL isn\u2019t a direct image link, ' +
        'or the host doesn\u2019t allow cross-origin (CORS) access. Try a direct link ending in .jpg/.png ' +
        'from a host that permits embedding (e.g. Wikimedia Commons).'
      )
    );
  }

  function showError(msg){
    hasImage = false;
    errorBox.textContent = msg;
    show(errorEl);
  }

  /* ---------------- share ---------------- */
  function shareLink(){
    if(!currentURL){ showToast('Load an image first, then share it.'); return; }
    const link = location.origin + location.pathname + '?img=' + encodeURIComponent(currentURL);
    const done = ()=> showToast('<b>Link copied</b> — it opens straight into this panorama.');
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(link).then(done).catch(()=>fallbackCopy(link, done));
    } else fallbackCopy(link, done);
  }
  function fallbackCopy(text, done){
    const ta = document.createElement('textarea');
    ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
    document.body.appendChild(ta); ta.select();
    try { document.execCommand('copy'); done(); }
    catch { prompt('Copy this link:', text); }
    ta.remove();
  }

  let toastTimer;
  function showToast(html){
    toast.innerHTML = html;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>toast.classList.remove('show'), 2600);
  }

  /* ---------------- UI auto-hide while idle over the scene ---------------- */
  let hideTimer;
  function wake(){
    bar.classList.remove('hidden');
    clearTimeout(hideTimer);
    if(hasImage && document.activeElement !== input){
      hideTimer = setTimeout(()=> bar.classList.add('hidden'), 3500);
    }
  }
  ['pointermove','pointerdown','keydown','wheel','touchstart'].forEach(ev=>
    addEventListener(ev, wake, {passive:true}));
  input.addEventListener('focus', wake);

  /* ---------------- wiring ---------------- */
  loadBtn.addEventListener('click', ()=> loadPanorama(input.value));
  input.addEventListener('keydown', e=>{ if(e.key === 'Enter') loadPanorama(input.value); });
  sampleBtn.addEventListener('click', ()=> loadPanorama(SAMPLE_URL));
  retryBtn.addEventListener('click', ()=>{ show(empty); input.focus(); });
  shareBtn.addEventListener('click', shareLink);

  /* boot: read ?img= from the URL */
  const param = new URLSearchParams(location.search).get('img');
  if(param) loadPanorama(param);
  else wake();
})();
</script>
</body>
</html>
